version: '3'
services:
  lirias_collector:
    image: lirias_collector:v2.1_20260128
    #image: registry.docker.libis.be/libis/lirias_collector:v2.1
    container_name: lirias_collector
    build: 
      context: ./
      dockerfile: Dockerfile
    networks: 
      - collector_network
    volumes:
      - ./config:/app/src/config/
      - ./records:/records/
  lirias_collector_develop:
    image: lirias_collector:v2.1_20260128
    build: 
      context: ./
      dockerfile: Dockerfile
    networks: 
      - collector_network
    volumes:
      - ./config/config_one_record_test.yml:/app/src/config/config.yml
      - ./config/lirias_ids.json:/app/src/config/lirias_ids.json
      - ./src:/app/src
      - ./records:/records/
  lirias_collector_staging:
    image: lirias_collector:v2.1_20260128
    container_name: lirias_collector
    build: 
      context: ./
      dockerfile: Dockerfile
    networks: 
      - collector_network
    volumes:
      - ./config/config_staging.yml:/app/src/config/config.yml
      - ./src:/app/src      
      - ./records:/records/    
      - ./tmp:/tmp/  

networks:
  collector_network:
    driver: bridge

